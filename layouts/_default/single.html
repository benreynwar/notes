{{ define "main" }}
  <article>
    <header class="article-header">
      <a class="back" href="{{ site.Home.RelPermalink }}">← All notes</a>
      <h1>{{ .Title }}</h1>
      {{ if eq .Section "notes" }}
        <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "January 2, 2006" }}</time>
      {{ end }}
    </header>
    <div class="content">
      {{ .Content }}
    </div>
    {{ with .GetTerms "tags" }}
      <footer class="tags">
        {{ range . }}<a href="{{ .RelPermalink }}">#{{ .LinkTitle }}</a>{{ end }}
      </footer>
    {{ end }}
  </article>
{{ end }}
